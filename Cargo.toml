[package]
name = "jefferies"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["app_config", "auth", "coordinator", "pipelines", "providers", "run_history", "server", "state_store", "backplane", "tenancy"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.22"
thiserror = "2.0.18"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.50.0", features = ["full"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
reqwest = "0.13.2"
rustls = { version = "0.23", features = ["ring"] }
kube = { version = "3.1.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"] }
schemars = "1.2.1"
toml = "1.1.2"
config = "0.15.22"
anyhow = "1.0.102"
app_config = { path = "app_config" }
coordinator = { path = "coordinator" }
run_history = { path = "run_history" }
server = { path = "server" }
pipelines = { path = "pipelines" }
chrono = { version = "0.4.44", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono", "uuid"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
providers = { path = "providers" }
octocrab = "0.49.7"
jsonwebtoken = { version = "10.3.0", features = ["use_pem"] }
state_store = { path = "state_store" }
backplane = { path = "backplane" }
tenancy = { path = "tenancy" }
futures-util = "0.3.32"
deadpool-lapin = "0.13.1"
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1", "script"] }
aws-sdk-s3 = "1.131.0"
aws-smithy-runtime-api = { version = "1.12.0", features = ["client"] }
aws-smithy-types = "1.4.7"
http-body-util = "0.1.3"
auth = { path = "auth" }
openidconnect = "4.0.1"
tower-sessions = "0.14.0"
tower-sessions-redis-store = "0.16.0"
fred = "10.1.0"
url = "2.5.7"
base64 = "0.22.1"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
app_config = { workspace = true }
server = { workspace = true }
rustls = { workspace = true }
