#     memory: 4Gi
#     cpu: "4"
#     steps:
#       - rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
#       - rustup component add clippy
#       - make ci
nodes:
  - name: Test Secrets
    image: quay.io/buildah/stable:latest
    privileged: true
    env:
      KUBECONFIG: /etc/tube/secrets/files/KUBECONFIG
    secrets:
      env:
        - QUAY_USERNAME
        - QUAY_PASSWORD
      files:
        - KUBECONFIG
        - name: PROXY_CERT
          path: /etc/pki/ca-trust/source/anchors/proxy.crt
    steps:
      - buildah login -u $QUAY_USERNAME -p $QUAY_PASSWORD quay.io
      - cat /etc/tube/secrets/files/KUBECONFIG
      - cat /etc/pki/ca-trust/source/anchors/proxy.crt
