name: Jefferies Main PR Pipeline

on:
  pull_request:
    branches:
      - main

nodes:
  - name: Format, Build, Lint and Test
    image: rust:1.95-slim
    checkout: true
    memory: 6Gi
    cpu: "2"
    workspace_size: 250Mi
    cache_size: 5Gi
    env:
      CARGO_HOME: /tmp/cache/cargo
      CARGO_TARGET_DIR: /tmp/cache/target
    steps:
      - rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - rustup component add clippy
      - apt-get install -y --no-install-recommends make mold clang
      - make ci
