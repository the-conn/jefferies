name: Jefferies Main PR Pipeline

on:
  pull_request:
    branches:
      - main

nodes:
  - name: Format, Build, Lint and Test
    image: quay.io/the-conn/jefferies-test
    checkout: true
    memory: 4Gi
    cpu: "4"
    timeout_secs: 1200
    steps:
      - rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - rustup component add clippy
      - make ci
