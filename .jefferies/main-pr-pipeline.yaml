name: Jefferies Main PR Pipeline

on:
  pull_request:
    branches:
      - main

nodes:
  - name: Build Test Image
    image: quay.io/buildah/stable:latest
    privileged: true
    checkout: true
    memory: 4Gi
    cpu: "4"
    env:
      STORAGE_DRIVER: vfs
    secrets:
      env:
        - QUAY_USERNAME
        - QUAY_PASSWORD
    steps:
      - buildah login -u $QUAY_USERNAME -p $QUAY_PASSWORD quay.io
      - buildah bud -f Containerfile-test -t quay.io/the-conn/jefferies-test .
      - buildah push quay.io/the-conn/jefferies-test

  - name: Run CI Checks
    image: quay.io/the-conn/jefferies-test
    checkout: true
    memory: 4Gi
    cpu: "4"
    steps:
      - rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - rustup component add clippy
      - make ci
