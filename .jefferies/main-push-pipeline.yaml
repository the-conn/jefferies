name: Jefferies Main Push Pipeline

on:
  push:
    branches:
      - main

nodes:
  - name: Build Image
    image: quay.io/buildah/stable:latest
    checkout: true
    privileged: true
    cpu: "2"
    memory: 4Gi
    timeout_secs: 1200
    steps:
      - buildah bud -f Containerfile -t quay.io/the-conn/jefferies .
