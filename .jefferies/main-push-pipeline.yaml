name: Jefferies Main Push Pipeline

on:
  push:
    branches:
      - main

nodes:
  - name: Build Image
    image: quay.io/buildah/stable:latest
    checkout: true
    privileged: true
    cache_size: 2Gi
    cpu: "2"
    memory: 4Gi
    steps:
      - buildah bud --network=host -f Containerfile -t quay.io/the-conn/jefferies --build-arg RUST_TAG=1.95-slim .
      - buildah push quay.io/the-conn/jefferies
