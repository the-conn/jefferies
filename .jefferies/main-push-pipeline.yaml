name: Jefferies Main Push Pipeline

on:
  push:
    branches:
      - main

nodes:
  - name: Build Image
    image: quay.io/buildah/stable:latest
    checkout: true
    privileged: true
    cpu: "4"
    memory: 8Gi
    timeout_secs: 1200
    env:
      STORAGE_DRIVER: vfs
    steps:
      - buildah bud -f Containerfile -t quay.io/the-conn/jefferies .
