name: Jefferies Main Push Pipeline

on:
  push:
    branches:
      - main

nodes:
  - name: Build Test Image
    image: quay.io/buildah/stable:latest
    privileged: true
    checkout: true
    env:
      STORAGE_DRIVER: vfs
    secrets:
      env:
        - QUAY_USERNAME
        - QUAY_PASSWORD
    steps:
      - buildah login -u $QUAY_USERNAME -p $QUAY_PASSWORD quay.io
      - buildah bud -f Containerfile-test -t quay.io/the-conn/jefferies-test .
      - buildah push quay.io/the-conn/jefferies-test

  - name: Build Jefferies Image
    image: quay.io/buildah/stable:latest
    after: ["Build Test Image"]
    checkout: true
    privileged: true
    cpu: "4"
    memory: 8Gi
    timeout_secs: 1200
    env:
      STORAGE_DRIVER: vfs
    secrets:
      env:
        - QUAY_USERNAME
        - QUAY_PASSWORD
    steps:
      - buildah login -u $QUAY_USERNAME -p $QUAY_PASSWORD quay.io
      - buildah bud -f Containerfile -t quay.io/the-conn/jefferies .
      - buildah push quay.io/the-conn/jefferies

  - name: Rollout Jefferies Deployment
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    after: ["Build Jefferies Image"]
    env:
      KUBECONFIG: /etc/tube/secrets/files/KUBECONFIG
    secrets:
      files:
        - KUBECONFIG
    steps:
      - oc --kubeconfig=$KUBECONFIG -n the-conn rollout restart deployment jefferies
