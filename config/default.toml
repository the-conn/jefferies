[server]
host = "0.0.0.0"
port = 8080

[log]
level = "info"

[pipeline]
default_pipeline_timeout_secs = 3600
default_node_timeout_secs = 600
default_node_startup_timeout_secs = 300
fail_fast = true

[redis]
url = "redis://localhost:6379"
password = ""

[rabbitmq]
url = "amqp://user:password@localhost:5672"

[rabbitmq.pool]
max_size = 16

[s3]
endpoint = "http://localhost:9000"
bucket = "the-conn-runs"
access_key = ""
secret_key = ""

[kubernetes]
namespace = "jefferies-jobs"
tube_image = "quay.io/the-conn/tube:latest"
default_node_image = "fedora:45"
service_account_privileged = "jefferies-jobs-privileged"
service_account_default = "jefferies-jobs-default"
vault_role = "the-conn-role"
runtime_class = "kata"
default_cpu = "1"
default_memory = "2Gi"

[postgres]
host = "localhost"
port = 5432
db = "postgres"
username = ""
password = ""

# These are placeholder values overridden in production via JEFFERIES__GITHUB__* env vars
[github]
app_id = ""
webhook_secret = ""
client_id = ""
client_secret = ""
private_key = ""
